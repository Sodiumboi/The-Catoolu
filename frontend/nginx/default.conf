server {
    listen 80;
    server_name catoolu.quest www.catoolu.quest dawn-catoolu.duckdns.org _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Cloudflare real IP passthrough ────────────────────
    # Cloudflare proxies requests — without this, all traffic
    # appears to come from Cloudflare's IPs, not the real visitor.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # ── Uploaded files (avatars etc.) → backend ──────────
    # ^~ prevents the .jpg/.png regex cache rule below from
    # intercepting these requests before they reach the backend.
    location ^~ /uploads/ {
        proxy_pass         http://backend:3001;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    }

    # ── API requests + WebSocket upgrade ──────────────────
    location /api/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;

        # These two headers are required for WebSocket upgrade
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 15m;
    }

    # ── Socket.io — dedicated location block ──────────────
    # Socket.io uses /socket.io/ path by default
    location /socket.io/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # WebSocket connections can be long-lived
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── React app — handle client-side routing ─────────────
    # Without this, refreshing /dashboard returns 404
    # because Nginx looks for a file called "dashboard"
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets ────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}