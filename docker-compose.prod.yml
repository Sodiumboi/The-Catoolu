version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: coc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       coc_production
      POSTGRES_USER:     coc_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coc_user -d coc_production"]
      interval: 10s
      timeout:  5s
      retries:  5

  backend:
    image: ghcr.io/YOUR_GITHUB_USERNAME/catoolu-backend:latest
    container_name: coc_backend
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  3

  frontend:
    image: ghcr.io/sodiumboi/catoolu-frontend:latest
    container_name: coc_frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data: