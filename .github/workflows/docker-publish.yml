name: Build and Push Docker Images

on:
  push:
    branches:
      - main # triggers on every push to main

permissions:
  contents: read
  packages: write # ← this is what was missing

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # 1. Check out the code
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 2. Set up QEMU for multi-platform builds (amd64 + arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      # 4. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      # 5. Build and push backend image
      - name: Build and push backend
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sodiumboi/catoolu-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Build and push frontend image
      - name: Build and push frontend
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ./frontend
          build-args: |
            VITE_CREATION_ENGINE_ENABLED=${{ vars.VITE_CREATION_ENGINE_ENABLED }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sodiumboi/catoolu-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
